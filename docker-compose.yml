services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tripnote
      POSTGRES_USER: tripnote
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripnote}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripnote"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-tripnote}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DEBUG: ${DEBUG:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
volumes:
  pgdata:
