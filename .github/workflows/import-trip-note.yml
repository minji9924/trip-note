name: Import trip-note ZIP

on:
  push:
    paths:
      - "trip-note 2.zip"
      - ".github/workflows/import-trip-note.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract project files
        run: |
          set -euo pipefail
          test -f "trip-note 2.zip"
          mkdir -p /tmp/trip-note-import
          unzip -q -o "trip-note 2.zip" -d /tmp/trip-note-import
          test -d /tmp/trip-note-import/trip-note
          cp -a /tmp/trip-note-import/trip-note/. .
          rm -f "trip-note 2.zip"

      - name: Commit extracted project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import trip-note project from ZIP"
            git push origin HEAD:main
          fi
